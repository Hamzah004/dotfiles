####################################################################################################
"$schema" = 'https://starship.rs/config-schema.json'
add_newline = false
# Minimalist & cool format - only show what matters
format = """$directory$git_branch$git_status$c$golang$java$kotlin$python$rust$dart$php$docker_context
$character"""

palette = 'minimal_cool'

[palettes.minimal_cool]
gray = '#6B7280'
blue = '#3B82F6'
green = '#10B981'
red = '#EF4444'
purple = '#8B5CF6'
white = '#F9FAFB'
dark = '#1F2937'

# Clean directory display
[directory]
format = "[$path](bold blue) "
truncation_length = 3
truncation_symbol = "…/"
home_symbol = "~"

[directory.substitutions]
"Documents" = "󰈙"
"Downloads" = ""
"Music" = "󰝚"
"Pictures" = ""
"Projects" = "󰲋"
"Code" = "󰲋"

# Minimal git info
[git_branch]
symbol = "󰊢 "
style = "purple"
format = "[$symbol$branch](purple) "

[git_status]
format = "[$all_status$ahead_behind](red) "
modified = "●"
untracked = "+"
staged = "✓"
deleted = "✗"
ahead = "↑"
behind = "↓"
conflicted = "⚡"

# Show languages when detected (expanded detection)
[nodejs]
symbol = "󰎙 "
format = "[$symbol$version](green) "

[python]
symbol = "󰌠 "
format = "[$symbol$version](blue) "

[rust]
symbol = "󱘗 "
format = "[$symbol$version](red) "

[java]
symbol = "󰬷 "
format = "[$symbol$version](red) "

[golang]
symbol = "󰟓 "
format = "[$symbol$version](blue) "

[c]
symbol = "󰙱 "
format = "[$symbol$version](gray) "

[kotlin]
symbol = "󱈙 "
format = "[$symbol$version](purple) "

[dart]
symbol = "󰻈 "
format = "[$symbol$version](blue) "

[php]
symbol = "󰌟 "
format = "[$symbol$version](purple) "

[docker_context]
symbol = "󰡨 "
format = "[$symbol$context](blue) "

# Elegant fill and timing
[fill]
symbol = "·"
style = "gray"

[cmd_duration]
min_time = 500
format = "[$duration](gray) "

[time]
disabled = false
time_format = "%H:%M"
format = "[$time](gray)"

# Clean prompt character
[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"

# Remove unnecessary elements
[os]
disabled = true

[username]
disabled = true

[hostname]
disabled = true
