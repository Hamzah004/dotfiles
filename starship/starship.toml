#####################################################################################################
"$schema" = 'https://starship.rs/config-schema.json'
add_newline = false
format = """
$directory\
$git_branch\
$git_status\
$character"""

palette = 'catppuccin'

[palettes.catppuccin]
# Synthwave / Vaporwave — neon 80s sunset on deep purple-black
# Aliases used throughout this config
color_fg0 = '#f9f871'    # neon yellow text
color_bg1 = '#1a103c'    # deep purple-black base
color_bg3 = '#2a1a5e'    # raised purple surface
color_blue = '#00f0ff'   # electric cyan
color_aqua = '#00f0ff'   # cyan
color_green = '#21ffba'  # neon mint
color_orange = '#ff8b00' # hot orange
color_purple = '#b026ff' # vivid purple
color_red = '#ff5fd2'    # hot pink
color_yellow = '#f9f871' # neon yellow
color_black = '#0d0721'  # darkest purple-black

# Bare names referenced directly in format strings
purple = '#b026ff'
red = '#ff5fd2'
green = '#21ffba'
blue = '#00f0ff'
white = '#f9f871'

[os]
disabled = false
style = "fg:color_red"

[os.symbols]
Redhat = "󱄛"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛 "
Alpine = ""
Amazon = ""
Android = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚 "
RedHatEnterprise = "󱄛"
Pop = ""

[username]
show_always = true
style_user = "bg:color_orange fg:color_fg0"
style_root = "bg:color_orange fg:color_fg0"
format = '[ $user ]($style)'

[directory]
style = "bold fg:color_yellow"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = "󰉍 "
"Music" = "󰝚 "
"Pictures" = " "
"Development" = "󰲋 "

[git_branch]
symbol = "󰊢 "
style = "purple"
format = "[$symbol$branch](purple) "

[git_status]
format = "[$all_status$ahead_behind](red) "
modified = "●"
untracked = "+"
staged = "✓"
deleted = "✗"
ahead = "↑"
behind = "↓"
conflicted = "⚡"

[nodejs]
symbol = "󰎙 "
format = "[$symbol$version](green) "

[python]
symbol = "󰌠 "
format = "[$symbol$version](blue) "

[rust]
symbol = "󱘗 "
format = "[$symbol$version](red) "

[java]
symbol = "󰬷 "
format = "[$symbol$version](red) "

[golang]
symbol = "󰟓 "
format = "[$symbol$version](blue) "

[c]
symbol = "󰙱 "
format = "[$symbol$version](blue) "

[kotlin]
symbol = "󱈙 "
format = "[$symbol$version](purple) "

[dart]
symbol = "󰻈 "
format = "[$symbol$version](blue) "

[php]
symbol = "󰌟 "
format = "[$symbol$version](purple) "

[docker_context]
symbol = "󰡨 "
format = "[$symbol$context](blue) "

[time]
disabled = false
time_format = "%R"
style = "bg:color_bg1"
format = '[[ $time](fg:white)]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[➜](bold fg:color_green)'
error_symbol = '[➜](bold fg:color_red)'

[custom.countdown]
command = "~/bin/countdown"
when = "test -x ~/bin/countdown"
format = "[$output ](fg:color_red)"

[cmd_duration]
min_time = 500
format = '[ ](fg:color_orange)$duration '

[fill]
symbol = '─'
style = 'fg:color_yellow'
